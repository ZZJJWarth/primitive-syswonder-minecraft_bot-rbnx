manifestVersion: 1

package:
  name: robonix.primitive.syswonder.minecraft_bot
  version: 0.1.0
  description: Minecraft Forge client primitive providing camera, lidar, chassis, perception, and Minecraft capabilities.
  tags: [primitive, minecraft, simulation, camera, lidar, chassis, perception]
  maintainers:
    - ZZJJWarth <jzeng25@stu.pku.edu.cn>
  license: MulanPSL-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/primitive/camera/snapshot
  - name: robonix/primitive/camera/depth_snapshot
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/camera/depth
  - name: robonix/primitive/camera/extrinsics
  - name: robonix/primitive/camera/intrinsics
  - name: robonix/primitive/camera/driver
  - name: robonix/primitive/lidar/lidar
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/driver
  - name: robonix/primitive/perception/objects
    path: capabilities/perception/objects.v1.toml
  - name: robonix/primitive/minecraft/inventory
    path: capabilities/minecraft/inventory.v1.toml
  - name: robonix/primitive/minecraft/get_state
    path: capabilities/minecraft/get_state.v1.toml
  - name: robonix/primitive/minecraft/aim_at_block
    path: capabilities/minecraft/aim_at_block.v1.toml
  - name: robonix/primitive/minecraft/break_block
    path: capabilities/minecraft/break_block.v1.toml
  - name: robonix/primitive/minecraft/deposit_item
    path: capabilities/minecraft/deposit_item.v1.toml
