[contract]
id = "robonix/primitive/minecraft/inspect_route_path"
version = "1"
kind = "primitive"
idl = "minecraft/srv/InspectRoutePath.srv"
description = "Inspect a bounded Navigation path corridor in minecraft_odom. navigation_x/y are transformed path points and recovery_token comes from PATH_BLOCKED. The provider applies its configured corridor width, sample spacing, and safety bound while the Mod uses the player's live body height. It reports exact dirt and non-clearable collision blocks without changing the world or inspecting the support layer."

[mode]
type = "rpc"
