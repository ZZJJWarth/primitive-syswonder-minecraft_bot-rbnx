# Deposit an exact positive item quantity into a reachable chest and verify synchronization.
[contract]
id      = "robonix/primitive/minecraft/deposit_item"
version = "1"
kind    = "primitive"
idl     = "minecraft/srv/DepositItem.srv"
description = "Compatibility interface for depositing into an explicit native Minecraft BlockPos. x/y/z must come from a native Minecraft source and must never be derived from Scene coordinates or goal_near. New Scene-driven callers must use v2 with a stable object_id. The operation verifies exact player and container count deltas and reports reach, crosshair, synchronization, and timeout failures explicitly."

[mode]
type = "rpc"
