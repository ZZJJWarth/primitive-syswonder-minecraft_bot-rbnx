[contract]
id      = "robonix/primitive/minecraft/attack_entity"
version = "1"
kind    = "primitive"
idl     = "minecraft/srv/AttackEntity.srv"
description = "Attack one visible nearby permitted entity until its live Entity UUID is confirmed dead. First call robonix/system/scene/list_objects and copy the selected object's stable id unchanged into object_id; expected_entity must be minecraft:zombie or minecraft:player. Zombies remain enabled by default. Player combat mode is disabled by default; allowlist mode accepts UUID/name entries from RBNX_MINECRAFT_ATTACKABLE_PLAYERS, while all mode accepts every other visible player. RBNX_MINECRAFT_PLAYER_CHASE_MODE=until_death removes ordinary timeout, origin-distance, target-displacement, attempt, and unsafe-drop limits for player targets, but retains low-health, death, disappearance, disconnect, and policy guards. The local player is never accepted. The primitive reacquires the moving entity by UUID every client tick and performs cooldown-aware normal attacks. Scene coordinates, camera estimates, goal_near poses, villagers, pets, and non-whitelisted entities are never accepted as attack targets."

[mode]
type = "rpc"

[semantics]
user_invocable = true
