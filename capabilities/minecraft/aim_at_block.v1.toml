# Gradually aim at an exact block selected from Scene without exposing Minecraft axis conversion.
[contract]
id      = "robonix/primitive/minecraft/aim_at_block"
version = "1"
kind    = "primitive"
idl     = "minecraft/srv/AimAtBlock.srv"
description = "Gradually aim the live crosshair at a visible reachable block without interacting with it. Pass the selected Scene object's x/y/z values unchanged as navigation_x/navigation_y/navigation_z. These values are the block centre in minecraft_odom; do not swap axes, negate values, round them, or use the robot pose or scene/goal_near approach pose. The provider deterministically converts the Scene centroid to the native Minecraft BlockPos."

[mode]
type = "rpc"

[semantics]
user_invocable = true
